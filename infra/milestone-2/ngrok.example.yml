version: "3"
tunnels:
  blazn-api:
    proto: http
    addr: http://127.0.0.1:58080
    domain: blazn.benpelo.com
    schemes: [https]

# This file deliberately exposes only the loopback API listener. PostgreSQL,
# the S3 API, and the S3 administration console have no ngrok tunnel.
# The ngrok service receives NGROK_AUTHTOKEN from its separate root-owned
# service environment; ngrok config files do not perform shell interpolation.
