name: blazn-m2

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the reviewed immutable digest}
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blazn}
      POSTGRES_USER: ${POSTGRES_USER:-blazn}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "${BLAZN_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${BLAZN_DATA_ROOT:?set BLAZN_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:mode=0770,uid=999,gid=999
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
    networks:
      - control

  object:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE to the reviewed immutable digest}
    restart: unless-stopped
    user: "1000:1000"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets:
      - s3_access_key
      - s3_secret_key
    ports:
      - "${BLAZN_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-59000}:9000"
      - "${BLAZN_BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - type: bind
        source: ${BLAZN_DATA_ROOT:?set BLAZN_DATA_ROOT}/objects
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
    networks:
      - control

  object-client:
    image: ${MINIO_MC_IMAGE:?set MINIO_MC_IMAGE to the reviewed immutable digest}
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-euc"]
    secrets:
      - s3_access_key
      - s3_secret_key
    networks:
      - control

  api:
    build:
      context: ../../services/control-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/postgres_url
      S3_ENDPOINT: http://object:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-blazn-poc}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets:
      - postgres_url
      - s3_access_key
      - s3_secret_key
    ports:
      - "${BLAZN_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      object:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    networks:
      - control

networks:
  control:
    driver: bridge

secrets:
  postgres_password:
    file: ${BLAZN_SECRETS_ROOT:?set BLAZN_SECRETS_ROOT}/postgres-password
  postgres_url:
    file: ${BLAZN_SECRETS_ROOT:?set BLAZN_SECRETS_ROOT}/postgres-url
  s3_access_key:
    file: ${BLAZN_SECRETS_ROOT:?set BLAZN_SECRETS_ROOT}/s3-access-key
  s3_secret_key:
    file: ${BLAZN_SECRETS_ROOT:?set BLAZN_SECRETS_ROOT}/s3-secret-key
