apiVersion: v1
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
     access_log off;
     error_log /dev/stderr warn;
     client_body_temp_path /tmp/client;
     proxy_temp_path /tmp/proxy;
     fastcgi_temp_path /tmp/fastcgi;
     uwsgi_temp_path /tmp/uwsgi;
     scgi_temp_path /tmp/scgi;
     server_tokens off;
     map_hash_bucket_size 256;
     # /secrets/keys.conf maps the Authorization header to $sparks_key_ok.
     include /secrets/keys.conf;
     server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / {
       if ($sparks_key_ok = 0) { return 401; }
       return 204;
      }
     }
    }
kind: ConfigMap
metadata:
  name: sparks-auth
  namespace: sparks-edge
