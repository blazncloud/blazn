apiVersion: v1
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
     access_log off;
     error_log /dev/stderr warn;
     client_body_temp_path /tmp/client;
     proxy_temp_path /tmp/proxy;
     fastcgi_temp_path /tmp/fastcgi;
     uwsgi_temp_path /tmp/uwsgi;
     scgi_temp_path /tmp/scgi;
     server {
      listen 8443 ssl;
      ssl_certificate /tls/public.crt;
      ssl_certificate_key /tls/private.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      client_max_body_size 1g;
      location ~ ^/v2/(blazn/(control-api|objectstore)(/.*)?|)$ {
       auth_basic "BlazeN isolated test registry";
       auth_basic_user_file /secrets/all.htpasswd;
       limit_except GET HEAD { auth_basic_user_file /secrets/push.htpasswd; }
       proxy_pass http://127.0.0.1:5000;
       proxy_set_header Host $http_host;
       proxy_set_header X-Forwarded-Proto https;
       proxy_request_buffering off;
       proxy_read_timeout 300;
      }
      location / { return 404; }
     }
    }
kind: ConfigMap
metadata:
  name: registry-nginx
  namespace: blazn-test
