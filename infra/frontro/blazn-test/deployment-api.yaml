apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: blazn-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: blazn-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blazn-api
        environment: test
        openbao: enabled
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '8080'
        - name: BIND_ADDRESS
          value: 127.0.0.1
        - name: PUBLIC_URL
          value: https://blazn-test.frontro.com
        - name: DATABASE_URL_FILE
          value: /secrets/database_url
        - name: S3_ENDPOINT
          value: https://objectstore.blazn-test.svc.cluster.local
        - name: S3_REGION
          value: us-east-1
        - name: S3_BUCKET
          value: blazn-test
        - name: S3_ACCESS_KEY_FILE
          value: /secrets/s3_access_key
        - name: S3_SECRET_KEY_FILE
          value: /secrets/s3_secret_key
        - name: NODE_EXTRA_CA_CERTS
          value: /public/object-ca.crt
        - name: TRUSTED_PROXY_CIDRS
          value: 127.0.0.1/32,::1/128
        - name: TRUSTED_PROXY_HOPS
          value: '1'
        - name: TRUSTED_PROXY_SECRET_FILE
          value: /secrets/proxy_key
        - name: WORKSPACE_INVITATION_HMAC_KEY_FILE
          value: /secrets/invitation_key
        - name: NODE_ENROLLMENT_HMAC_FILE
          value: /secrets/node_enrollment_key
        - name: BLAZN_NODE_BROKER_LOOPBACK
          value: disabled
        image: registry.blazn-test.internal/blazn/control-api@sha256:50c49b94fec94dcac5584a25652f4c8a1f39d46c0a3d95f316356101fbd3c254
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          tcpSocket:
            port: 8081
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 256Mi
            memory: 1Gi
          requests:
            cpu: 100m
            ephemeral-storage: 128Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /secrets
          name: rendered
          readOnly: true
        - mountPath: /public
          name: public
          readOnly: true
        - mountPath: /tmp
          name: api-tmp
      - args:
        - agent
        - -config=/agent/sidecar.hcl
        image: ghcr.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4
        imagePullPolicy: IfNotPresent
        name: secrets-renew
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 64Mi
            memory: 128Mi
          requests:
            cpu: 50m
            ephemeral-storage: 32Mi
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /agent
          name: agent
          readOnly: true
        - mountPath: /ca
          name: ca
          readOnly: true
        - mountPath: /identity
          name: identity
          readOnly: true
        - mountPath: /rendered
          name: rendered
        - mountPath: /tmp
          name: agent-tmp
      - command:
        - nginx
        - -c
        - /config/nginx.conf
        - -g
        - daemon off;
        image: nginxinc/nginx-unprivileged@sha256:9f1d635195267228edfdad0bbaacf390031785924f10f8449ff9c934ff765290
        imagePullPolicy: IfNotPresent
        name: proxy
        ports:
        - containerPort: 8081
          name: proxy
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            ephemeral-storage: 64Mi
            memory: 128Mi
          requests:
            cpu: 25m
            ephemeral-storage: 32Mi
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: proxy-config
          readOnly: true
        - mountPath: /secrets
          name: rendered
          readOnly: true
        - mountPath: /tmp
          name: proxy-tmp
      dnsPolicy: ClusterFirst
      hostAliases:
      - hostnames:
        - frontro-db-1
        ip: 192.168.0.105
      imagePullSecrets:
      - name: registry-pull
      initContainers:
      - args:
        - agent
        - -config=/agent/init.hcl
        image: ghcr.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4
        imagePullPolicy: IfNotPresent
        name: secrets
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 64Mi
            memory: 128Mi
          requests:
            cpu: 50m
            ephemeral-storage: 32Mi
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /agent
          name: agent
          readOnly: true
        - mountPath: /ca
          name: ca
          readOnly: true
        - mountPath: /identity
          name: identity
          readOnly: true
        - mountPath: /rendered
          name: rendered
        - mountPath: /tmp
          name: agent-tmp
      nodeSelector:
        kubernetes.io/hostname: ben5
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: blazn-api
      serviceAccountName: blazn-api
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: api-agent
        name: agent
      - configMap:
          defaultMode: 420
          name: openbao-client-ca
        name: ca
      - configMap:
          defaultMode: 420
          name: api-public-ca
        name: public
      - name: identity
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: openbao
              expirationSeconds: 900
              path: token
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: rendered
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: api-tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: agent-tmp
      - configMap:
          defaultMode: 420
          name: api-proxy
        name: proxy-config
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: proxy-tmp
