apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: blazn-test
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: proxy
  selector:
    app: blazn-api
  sessionAffinity: None
  type: ClusterIP
