apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-dev-node-broker-egress
  namespace: blazn-test
spec:
  egress:
  - ports:
    - port: 18081
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.168.0.100/32
  podSelector:
    matchLabels:
      app: blazn-api-dev
  policyTypes:
  - Egress
