apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: blazn-test
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    app: registry
  sessionAffinity: None
  type: ClusterIP
