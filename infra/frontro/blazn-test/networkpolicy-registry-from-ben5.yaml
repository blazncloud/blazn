apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-from-ben5
  namespace: blazn-test
spec:
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.0.125/32
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: registry
  policyTypes:
  - Ingress
