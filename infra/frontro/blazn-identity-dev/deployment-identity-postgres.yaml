apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-postgres
  namespace: blazn-identity-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: identity-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: identity-postgres
        openbao: enabled
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - postgres
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/tls/tls.crt
        - -c
        - ssl_key_file=/tls/tls.key
        env:
        - name: POSTGRES_PASSWORD_FILE
          value: /secrets/pg-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        imagePullPolicy: IfNotPresent
        name: identity-postgres
        ports:
        - containerPort: 5432
          name: service
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /secrets
          name: rendered
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /tls
          name: tls
          readOnly: true
        - mountPath: /var/run/postgresql
          name: pg-run
      - args:
        - agent
        - -config=/agent/sidecar.hcl
        image: ghcr.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4
        imagePullPolicy: IfNotPresent
        name: secrets-renew
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /agent
          name: agent
          readOnly: true
        - mountPath: /ca
          name: ca
          readOnly: true
        - mountPath: /identity
          name: identity
          readOnly: true
        - mountPath: /rendered
          name: rendered
        - mountPath: /tmp
          name: agent-tmp
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - agent
        - -config=/agent/init.hcl
        image: ghcr.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4
        imagePullPolicy: IfNotPresent
        name: secrets
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /agent
          name: agent
          readOnly: true
        - mountPath: /ca
          name: ca
          readOnly: true
        - mountPath: /identity
          name: identity
          readOnly: true
        - mountPath: /rendered
          name: rendered
        - mountPath: /tmp
          name: agent-tmp
      nodeSelector:
        kubernetes.io/hostname: ben5
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: blazn-dev-identity-database
      serviceAccountName: blazn-dev-identity-database
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: identity-postgres-agent
        name: agent
      - configMap:
          defaultMode: 420
          name: openbao-client-ca
        name: ca
      - name: identity
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: openbao
              expirationSeconds: 900
              path: token
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: rendered
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: agent-tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: tmp
      - name: data
        persistentVolumeClaim:
          claimName: database
      - name: tls
        secret:
          defaultMode: 288
          secretName: database-tls
      - emptyDir: {}
        name: pg-run
