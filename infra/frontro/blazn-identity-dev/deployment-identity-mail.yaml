apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-mail
  namespace: blazn-identity-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: identity-mail
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: identity-mail
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MP_DATABASE
          value: /tmp/mail.db
        - name: MP_MAX_MESSAGES
          value: '100'
        - name: MP_MAX_AGE
          value: 1h
        - name: MP_MAX_MESSAGE_SIZE
          value: '1'
        - name: MP_SMTP_MAX_RECIPIENTS
          value: '1'
        - name: MP_SMTP_ALLOWED_RECIPIENTS
          value: ^qualification-[a-z0-9-]+@blazn\.invalid$
        - name: MP_SMTP_DISABLE_RDNS
          value: 'true'
        - name: MP_QUIET
          value: 'true'
        image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
        imagePullPolicy: IfNotPresent
        name: mail
        ports:
        - containerPort: 1025
          name: smtp
          protocol: TCP
        - containerPort: 8025
          name: inbox
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8025
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: ben5
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 64Mi
        name: tmp
