apiVersion: v1
kind: Service
metadata:
  name: zitadel-api
  namespace: blazn-identity-dev
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8080
    protocol: TCP
    targetPort: service
  selector:
    app: identity-api
  sessionAffinity: None
  type: ClusterIP
