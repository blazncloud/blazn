apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: blazn-hosting
  name: blazn-node-update-shadow
spec:
  failurePolicy: Ignore
  matchConditions:
  - expression: request.userInfo.username.startsWith('system:node:') && 'system:nodes' in request.userInfo.groups
    name: node-credential
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - nodes
      scope: '*'
  validations:
  - expression: object.metadata.name == request.userInfo.username.substring(12)
    message: a node credential modified another Node
  - expression: '(has(object.spec.taints) ? object.spec.taints : []) == (has(oldObject.spec.taints) ? oldObject.spec.taints : [])'
    message: a node credential changed Node taints
  - expression: |-
      (has(object.metadata.labels) ? object.metadata.labels : {}).all(k,
        !k.startsWith('node-restriction.kubernetes.io/') ||
        (has(oldObject.metadata.labels) && k in oldObject.metadata.labels && oldObject.metadata.labels[k] == object.metadata.labels[k])) &&
      (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}).all(k,
        !k.startsWith('node-restriction.kubernetes.io/') ||
        (has(object.metadata.labels) && k in object.metadata.labels))
    message: a node credential changed a node-restriction.kubernetes.io label
