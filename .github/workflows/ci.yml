name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Check generated API client
        run: make check-generated
      - name: Check generated workspace API client
        run: make check-workspace-generated
      - name: Check generated Node API client and signed models
        run: make check-node-generated
      - name: Check generated proxy contracts
        run: make check-proxy-generated
      - name: Check generated Sandbox API client
        run: make check-sandbox-generated
      - name: Verify Sandbox contracts and fixtures
        run: make test-sandbox-contract
      - name: Run unit tests
        run: make test
      - name: Verify release packaging
        run: make test-release
      - name: Verify signed installer behavior
        run: make test-install

  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify pinned Node control API
        run: make test-control-api

  workspace-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify workspace persistence with the restricted runtime role
        run: ./scripts/test-workspace-postgres.sh

  project-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Project persistence, tenant isolation, idempotency, and no-delete policy
        run: ./scripts/test-project-postgres.sh

  node-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Node persistence and broker least privilege
        run: ./scripts/test-node-postgres.sh

  sandbox-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Sandbox persistence, tenant isolation, receipts, and grants
        run: ./scripts/test-sandbox-postgres.sh

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Milestone 2 deployment contracts
        run: make test-infra
