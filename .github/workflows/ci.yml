name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Check generated API client
        run: make check-generated
      - name: Check generated workspace API client
        run: make check-workspace-generated
      - name: Check generated Project API client
        run: make check-project-generated
      - name: Check generated Run and Artifact API client
        run: make check-run-generated
      - name: Check generated Agent and Harness API client
        run: make check-agent-harness-generated
      - name: Check generated Node API client and signed models
        run: make check-node-generated
      - name: Check generated proxy contracts
        run: make check-proxy-generated
      - name: Check generated Sandbox API client
        run: make check-sandbox-generated
      - name: Verify Sandbox contracts and fixtures
        run: make test-sandbox-contract
      - name: Verify Agent and Harness contracts and fixtures
        run: make test-harness-contract
      - name: Verify hosted identity contracts and isolation
        run: make test-identity
      - name: Verify root-owned identity secret generation
        run: sudo make test-identity-root
      - name: Run unit tests
        run: make test
      - name: Verify isolated identity contract
        run: make test-identity
      - name: Verify Development build and publication contract
        run: make test-development-contract
      - name: Verify release packaging
        run: make test-release
      - name: Verify signed installer behavior
        run: make test-install

  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify pinned Node control API
        run: make test-control-api

  workspace-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify workspace persistence with the restricted runtime role
        run: ./scripts/test-workspace-postgres.sh

  project-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Project persistence, tenant isolation, idempotency, and no-delete policy
        run: ./scripts/test-project-postgres.sh

  run-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Run and Artifact persistence, isolation, receipts, and no-delete policy
        run: ./scripts/test-run-postgres.sh

  agent-harness-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Agent, Harness, and lease-fenced Run controller persistence
        run: ./scripts/test-agent-harness-postgres.sh

  development-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Development persistence, tenant isolation, replay, and finalizer denial
        run: ./scripts/test-development-postgres.sh

  node-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Node persistence and broker least privilege
        run: ./scripts/test-node-postgres.sh

  sandbox-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Sandbox persistence, tenant isolation, receipts, and grants
        run: ./scripts/test-sandbox-postgres.sh

  sandbox-controller-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify fenced Sandbox controller database authority
        run: ./scripts/test-sandbox-controller-postgres.sh

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Milestone 2 deployment contracts
        run: make test-infra
