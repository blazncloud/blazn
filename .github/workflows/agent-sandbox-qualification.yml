name: Agent Sandbox qualification

on:
  pull_request:
    paths:
      - "infra/agent-sandbox/**"
      - "docs/agent-sandbox-qualification.md"
      - ".github/workflows/agent-sandbox-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - run: infra/agent-sandbox/test-static.sh
      - run: infra/agent-sandbox/test-phase4c-static.sh
      - run: infra/agent-sandbox/test-phase5-boundary-static.sh
      - run: infra/agent-sandbox/test-phase5-install-static.sh
      - run: shellcheck infra/agent-sandbox/*.sh
      - run: shellcheck infra/agent-sandbox/phase4c/*.sh
      - run: shellcheck infra/agent-sandbox/phase5-boundary/*.sh
      - run: shellcheck infra/agent-sandbox/phase5-build/*.sh
      - run: shellcheck infra/agent-sandbox/phase5-install/*.sh

  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/agent-sandbox/test-phase4c-transaction.sh

  kueue-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - run: infra/agent-sandbox/test-phase4c-kueue-transaction.sh

  boundary-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - run: infra/agent-sandbox/test-phase5-boundary-transaction.sh

  boundary-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - run: infra/agent-sandbox/test-phase5-boundary-disposable.sh

  build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/agent-sandbox/test-phase5-build-e2e.sh

  install-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - run: infra/agent-sandbox/test-phase5-install-disposable.sh

  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/agent-sandbox/test-disposable.sh
