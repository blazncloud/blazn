name: Agent Sandbox qualification

on:
  pull_request:
    paths:
      - "infra/agent-sandbox/**"
      - "docs/agent-sandbox-qualification.md"
      - ".github/workflows/agent-sandbox-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/agent-sandbox/test-static.sh
      - run: infra/agent-sandbox/test-phase4c-static.sh
      - run: infra/agent-sandbox/test-phase4c-transaction.sh
      - run: shellcheck infra/agent-sandbox/*.sh
      - run: shellcheck infra/agent-sandbox/phase4c/*.sh

  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/agent-sandbox/test-disposable.sh
