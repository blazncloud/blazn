{
  "apiVersion": "blazn.dev/v1alpha1",
  "kind": "SandboxTemplate",
  "metadata": {"name": "coding-agent"},
  "spec": {
    "version": "bootstrap-node-22.19.0",
    "description": "Deterministic non-sensitive coding-agent bootstrap template",
    "policyProfile": "poc-restricted-v1",
    "isolation": "approved-non-sensitive-poc",
    "expiresInSeconds": 900,
    "networkProfile": "default-deny-v1",
    "variants": [
      {
        "name": "linux-amd64",
        "platform": "linux",
        "architecture": "amd64",
        "imageIndex": "docker.io/library/node@sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9",
        "imageDigest": "docker.io/library/node@sha256:704b199e36b5c1bc505da773f742299dc1ee5a4c70b86d1eb406c334f63253c6",
        "command": ["node", "--version"],
        "resources": {"requests": {"cpu": "100m", "memory": "128Mi", "ephemeralStorage": "1Gi"}, "limits": {"cpu": "1", "memory": "1Gi", "ephemeralStorage": "2Gi"}},
        "placementProfile": "poc-linux-amd64-v1"
      },
      {
        "name": "linux-arm64",
        "platform": "linux",
        "architecture": "arm64",
        "imageIndex": "docker.io/library/node@sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9",
        "imageDigest": "docker.io/library/node@sha256:e6c1046051434cd96938528fae1d2faa0ec25dd543e313bb178d7368349e8d9e",
        "command": ["node", "--version"],
        "resources": {"requests": {"cpu": "100m", "memory": "128Mi", "ephemeralStorage": "1Gi"}, "limits": {"cpu": "1", "memory": "1Gi", "ephemeralStorage": "2Gi"}},
        "placementProfile": "poc-mac-arm64-v1"
      }
    ],
    "repositories": [{"name": "source", "url": "https://github.com/blazncloud/blazn.git", "destination": "/workspace/src/blazn", "writable": true}],
    "artifacts": [{"name": "patch", "path": "/workspace/artifacts/change.patch", "mediaType": "text/plain", "required": true}]
  }
}
